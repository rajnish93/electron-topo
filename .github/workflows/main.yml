name: Release Electron App

on:
  push:
    branches:
      - electron
    # tags:
    #   - 'v*' # This triggers the release when a tag is pushed

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build and package Electron app
        run: npm run make

      - name: Publish to GitHub Releases for Windows (64-bit and 32-bit)
        run: |
          # Publishing for 64-bit Windows (exe)
          npx electron-forge publish --platform=win32 --arch=x64 --publish=always
          # Publishing for 32-bit Windows (exe)
          npx electron-forge publish --platform=win32 --arch=ia32 --publish=always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Referencing the secret

      - name: Publish to GitHub Releases for Linux (Ubuntu)
        run: |
          # Publishing for 64-bit Linux (deb)
          npx electron-forge publish --platform=linux --arch=x64 --publish=always
          # Publishing for 32-bit Linux (deb)
          npx electron-forge publish --platform=linux --arch=ia32 --publish=always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Referencing the secret

      - name: Publish to GitHub Releases for macOS
        run: |
          # Publishing for 64-bit macOS (dmg)
          npx electron-forge publish --platform=darwin --arch=x64 --publish=always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Referencing the secret
